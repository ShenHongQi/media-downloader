<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <title>Media Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Media Downloader</h1>
            <button class="settings-btn" onclick="toggleSettings()">⚙</button>
        </header>

        <div id="settingsPanel" class="settings-panel hidden">
            <label>解析模式</label>
            <div class="mode-switch">
                <button id="modeLocal" class="mode-btn active" onclick="setMode('local')">本地解析</button>
                <button id="modeRemote" class="mode-btn" onclick="setMode('remote')">远程服务器</button>
            </div>
            <div id="remoteConfig" class="hidden">
                <label>服务器地址</label>
                <input type="text" id="serverUrl" placeholder="http://192.168.1.100:8000">
            </div>
            <button onclick="saveSettings()">保存</button>
            <p class="hint">本地解析：无需服务器，App 直接解析<br>远程服务器：连接你部署的后端服务</p>
        </div>

        <main>
            <div class="input-section">
                <div class="input-toolbar">
                    <button id="pasteBtn" class="tool-btn" onclick="pasteFromClipboard()">📋 粘贴链接</button>
                    <button id="clearBtn" class="tool-btn hidden" onclick="clearInput()">✕ 清除</button>
                </div>
                <textarea id="urlInput" placeholder="粘贴分享链接（支持抖音、B站、小红书、快手、TikTok、Instagram）"></textarea>
                <button id="parseBtn" onclick="handleParse()">解析</button>
            </div>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <span>解析中...</span>
            </div>

            <div id="results" class="results"></div>
        </main>
    </div>

    <div id="lightbox" class="lightbox hidden" onclick="closeLightbox()">
        <img src="" alt="">
    </div>
    <script src="parsers.js"></script>
    <script src="app.js"></script>
</body>
</html>
